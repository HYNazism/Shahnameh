<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgLapis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="50%" stop-color="#0B0908" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="sadehFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>
  <!-- Background Square -->
  <rect width="512" height="512" rx="72" fill="url(#bgLapis)" />
  <!-- Outer Gold Miniature Frame -->
  <rect x="28" y="28" width="456" height="456" rx="48" fill="none" stroke="url(#goldLeaf)" stroke-width="10" />
  <rect x="46" y="46" width="420" height="420" rx="36" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="14 8" />
  <!-- Simurgh Golden Wings -->
  <path d="M 256 150 C 175 100, 96 125, 68 188 C 122 178, 185 178, 232 204" fill="none" stroke="url(#goldLeaf)" stroke-width="10" stroke-linecap="round" />
  <path d="M 256 150 C 337 100, 416 125, 444 188 C 390 178, 327 178, 280 204" fill="none" stroke="url(#goldLeaf)" stroke-width="10" stroke-linecap="round" />
  <!-- Sacred Sadeh Flame -->
  <path d="M 256 96 C 310 158, 325 224, 256 286 C 187 224, 202 158, 256 96 Z" fill="url(#sadehFlame)" stroke="#FDE68A" stroke-width="6" />
  <!-- Sassanian-Pishdadian Royal Crown -->
  <path d="M 136 336 L 158 228 L 210 278 L 256 196 L 302 278 L 354 228 L 376 336 Z" fill="url(#goldLeaf)" stroke="#0B0908" stroke-width="8" stroke-linejoin="round" />
  <rect x="132" y="336" width="248" height="28" rx="8" fill="#991B1B" stroke="url(#goldLeaf)" stroke-width="6" />
  <!-- Typography Emblem -->
  <text x="256" y="424" text-anchor="middle" fill="#FDE68A" font-family="Georgia, serif" font-size="44" font-weight="bold" letter-spacing="4">SHAHNAMEH</text>
</svg>
